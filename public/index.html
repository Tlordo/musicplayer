<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app">
    <!-- Сайдбар с библиотекой -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <i class="fas fa-music"></i>
          <h1>Моя музыка</h1>
        </div>
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" id="search-input" placeholder="Поиск в библиотеке...">
          <button id="clear-search" class="clear-search hidden">
            <i class="fas fa-times"></i>
          </button>
        </div>
        <div class="stats">
          <span id="track-count">0 треков</span>
          <span id="total-duration">0:00</span>
        </div>
      </div>
      
      <div class="playlist-container">
        <div class="playlist-header">
          <h2>Плейлист</h2>
          <div class="view-options">
            <button class="view-btn active" data-view="list" title="Список">
              <i class="fas fa-list"></i>
            </button>
            <button class="view-btn" data-view="grid" title="Плитка">
              <i class="fas fa-th"></i>
            </button>
            <button class="view-btn" data-view="compact" title="Компактный">
              <i class="fas fa-grip-lines"></i>
            </button>
            <button class="view-btn" data-view="table" title="Таблица">
              <i class="fas fa-table"></i>
            </button>
          </div>
          <div class="sort-options">
            <button class="sort-btn active" data-sort="default" title="По дате добавления">
              <i class="fas fa-clock"></i>
            </button>
            <button class="sort-btn" data-sort="title" title="По названию">
              <i class="fas fa-sort-alpha-down"></i>
            </button>
            <button class="sort-btn" data-sort="artist" title="По исполнителю">
              <i class="fas fa-user"></i>
            </button>
            <button class="sort-btn" data-sort="album" title="По альбому">
              <i class="fas fa-compact-disc"></i>
            </button>
          </div>
        </div>
        
        <!-- Представление: Список -->
        <ul id="playlist-list" class="playlist-list">
        </ul>
        
        <!-- Представление: Плитка -->
        <div id="playlist-grid" class="playlist-grid hidden">
        </div>
        
        <!-- Представление: Компактный -->
        <ul id="playlist-compact" class="playlist-compact hidden">
        </ul>
        
        <!-- Представление: Таблица -->
        <div id="playlist-table" class="playlist-table hidden">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th></th>
                <th>Название</th>
                <th>Исполнитель</th>
                <th>Альбом</th>
                <th>Длительность</th>
              </tr>
            </thead>
            <tbody id="table-body">
            </tbody>
          </table>
        </div>
      </div>
      
      <div class="sidebar-footer">
        <button id="add-btn" class="add-track-btn">
          <i class="fas fa-plus"></i>
          <span>Добавить трек</span>
        </button>
        <button id="toggle-sidebar" class="toggle-sidebar-btn" title="Скрыть панель">
          <i class="fas fa-chevron-left"></i>
        </button>
      </div>
    </aside>

    <!-- Кнопка показа скрытого сайдбара -->
    <button id="show-sidebar" class="show-sidebar-btn hidden" title="Показать панель">
      <i class="fas fa-chevron-right"></i>
    </button>

    <!-- Основная панель плеера -->
    <main class="player-panel">
      <div class="background-blur" id="background-blur"></div>
      
      <!-- Визуализатор -->
      <canvas id="visualizer" class="visualizer"></canvas>
      
      <div class="player-content">
        <!-- Информация о текущем треке -->
        <div class="track-display">
          <div class="cover-container">
            <img id="cover" src="" alt="Обложка" class="cover">
            <div class="cover-overlay">
              <button id="expand-cover" title="Увеличить обложку">
                <i class="fas fa-expand"></i>
              </button>
            </div>
            <!-- Индикатор воспроизведения на обложке -->
            <div class="playing-animation" id="playing-animation">
              <span class="bar"></span>
              <span class="bar"></span>
              <span class="bar"></span>
              <span class="bar"></span>
            </div>
          </div>
          
          <div class="track-details">
            <div class="track-meta">
              <span id="track-album" class="album-name">Альбом</span>
              <span class="dot">•</span>
              <span id="track-year" class="year">2024</span>
              <span class="dot">•</span>
              <span id="track-quality" class="quality">HQ</span>
            </div>
            <h2 id="track-title" class="track-title-main">Выберите трек</h2>
            <p id="track-artist" class="track-artist-main">Исполнитель</p>
            <div class="track-stats">
              <span id="track-views" title="Просмотры">
                <i class="fas fa-eye"></i> 0
              </span>
              <span id="track-likes" title="Лайки">
                <i class="fas fa-heart"></i> 0
              </span>
              <span id="track-bitrate" title="Битрейт">
                <i class="fas fa-wave-square"></i> 0 kbps
              </span>
            </div>
          </div>
        </div>

        <!-- Прогресс с волновой формой -->
        <div class="progress-section">
          <div class="waveform-container" id="waveform">
            <!-- Генерируется динамически -->
          </div>
          <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar">
              <div class="progress-fill" id="progress-fill"></div>
              <div class="progress-thumb" id="progress-thumb"></div>
              <div class="progress-hover" id="progress-hover"></div>
            </div>
          </div>
          <div class="time-display">
            <span id="current-time">0:00</span>
            <span id="total-time">0:00</span>
          </div>
        </div>

        <!-- Управление -->
        <div class="controls-section">
          <div class="main-controls">
            <button id="shuffle-btn" class="control-btn" title="Перемешать">
              <i class="fas fa-random"></i>
            </button>
            <button id="prev-btn" class="control-btn" title="Предыдущий">
              <i class="fas fa-step-backward"></i>
            </button>
            <button id="play-btn" class="play-btn" title="Воспроизвести">
              <i class="fas fa-play"></i>
            </button>
            <button id="next-btn" class="control-btn" title="Следующий">
              <i class="fas fa-step-forward"></i>
            </button>
            <button id="repeat-btn" class="control-btn" title="Повторять">
              <i class="fas fa-redo"></i>
            </button>
          </div>
          
          <div class="additional-controls">
            <div class="volume-control">
              <button id="volume-btn" class="control-btn-small">
                <i class="fas fa-volume-up"></i>
              </button>
              <div class="volume-slider-container">
                <input type="range" id="volume-slider" class="volume-slider" 
                       min="0" max="100" value="75">
              </div>
            </div>
            
            <div class="speed-control">
              <button id="speed-btn" class="control-btn-small">
                <span>1x</span>
              </button>
              <div class="speed-options" id="speed-options">
                <button data-speed="0.5">0.5x</button>
                <button data-speed="0.75">0.75x</button>
                <button data-speed="1" class="active">1x</button>
                <button data-speed="1.25">1.25x</button>
                <button data-speed="1.5">1.5x</button>
                <button data-speed="2">2x</button>
              </div>
            </div>

            <!-- Кнопка визуализатора -->
            <button id="visualizer-btn" class="control-btn-small active" title="Визуализатор">
              <i class="fas fa-chart-bar"></i>
            </button>
            
            <button id="download-btn" class="control-btn-small" title="Скачать">
              <i class="fas fa-download"></i>
            </button>
            
            <button id="delete-btn" class="control-btn-small" title="Удалить">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Модальное окно добавления трека -->
  <div id="add-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Добавить трек</h2>
        <button class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="input-group">
          <i class="fas fa-link"></i>
          <input type="text" id="url-input" placeholder="Вставьте ссылку YouTube Music">
        </div>
        <div class="url-examples">
          <p>Примеры ссылок:</p>
          <code>https://music.youtube.com/watch?v=VIDEO_ID</code>
          <code>https://youtu.be/VIDEO_ID</code>
        </div>
        <div id="add-status" class="status-message"></div>
        <!-- Прогресс загрузки -->
        <div id="download-progress" class="download-progress hidden">
          <div class="progress-bar-mini">
            <div class="progress-fill-mini" id="progress-fill-mini"></div>
          </div>
          <span id="progress-text">0%</span>
        </div>
      </div>
      <div class="modal-footer">
        <button id="cancel-add" class="secondary-btn">Отмена</button>
        <button id="submit-add" class="primary-btn">
          <i class="fas fa-download"></i>
          Загрузить
        </button>
      </div>
    </div>
  </div>

  <!-- Модальное окно полноэкранной обложки -->
  <div id="cover-modal" class="modal hidden">
    <div class="cover-fullscreen">
      <button class="close-btn">&times;</button>
      <img id="cover-full" src="" alt="Обложка">
    </div>
  </div>

  <!-- Модальное окно информации о треке -->
  <div id="info-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Информация о треке</h2>
        <button class="close-btn">&times;</button>
      </div>
      <div class="modal-body" id="track-info-content">
        <!-- Заполняется динамически -->
      </div>
    </div>
  </div>

  <!-- Нижняя навигация (мобильная) -->
  <nav class="bottom-nav" id="bottom-nav">
    <button class="bottom-nav-btn" data-tab="player" title="Плеер">
      <i class="fas fa-music"></i>
      <span>Плеер</span>
    </button>
    <button class="bottom-nav-btn active" data-tab="library" title="Библиотека">
      <i class="fas fa-list"></i>
      <span>МОЁ</span>
    </button>
  </nav>

  <!-- Уведомления -->
  <div id="notifications" class="notifications"></div>

  <audio id="audio" preload="auto" crossorigin="anonymous"></audio>

  <script src="script.js"></script>
</body>
</html>
