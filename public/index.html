<!DOCTYPE html>
<html lang="ru" data-design="classic">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>Моя музыка</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230a0a0a'/%3E%3Cpath d='M9 17.5a2.5 2.5 0 1 1-2.5-2.5H9V6.5l9-1.7v10.7a2.5 2.5 0 1 1-2.5-2.5H18' fill='none' stroke='%231db954' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/classic.css" id="design-css">
  <script>
    // Дизайн выбираем до первой отрисовки, чтобы не мигал чужой стиль.
    try {
      var mkDesign = (JSON.parse(localStorage.getItem('mk.settings.v2') || '{}').design) || 'classic';
      if (mkDesign !== 'classic' && mkDesign !== 'cassette') mkDesign = 'classic';
      document.documentElement.dataset.design = mkDesign;
      document.getElementById('design-css').href = 'css/' + mkDesign + '.css';
    } catch (e) { /* хранилище недоступно — остаётся классика */ }
  </script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 5h2.4v14H6zM20 5v14L9.5 12z" fill="currentColor"/></symbol>

      <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 7h3.5c4.5 0 6.5 10 11 10H21M3 17h3.5c1.6 0 2.8-1.2 3.8-2.8M13.7 9.8C14.7 8.2 15.9 7 17.5 7H21M18 4l3 3-3 3M18 14l3 3-3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>

      <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-erase" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6.5 7l1 13h9l1-13M10 11v5M14 11v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>

      <symbol id="i-lyrics" viewBox="0 0 24 24"><path d="M4 6h11M4 10.5h8M4 15h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M17 17.5a2.5 2.5 0 1 1-2.5-2.5H17V7l4-1.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>

      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/></symbol>

      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>

      <symbol id="i-card" viewBox="0 0 24 24"><path d="M4 4h16v16H4zM8 9h8M8 12.5h8M8 16h5" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
      <symbol id="i-tape" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8.5" cy="11" r="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="15.5" cy="11" r="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6.5 19l1.5-3h8l1.5 3" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
      <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18.5a2.5 2.5 0 1 1-2.5-2.5H9V5.5l11-2v12a2.5 2.5 0 1 1-2.5-2.5H20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="4.5" cy="6" r="1.4" fill="currentColor"/><circle cx="4.5" cy="12" r="1.4" fill="currentColor"/><circle cx="4.5" cy="18" r="1.4" fill="currentColor"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2.8" fill="currentColor"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-9.3-9.2C1.4 7.4 3.6 4 7.1 4c2 0 3.6 1.1 4.9 2.8C13.3 5.1 14.9 4 16.9 4c3.5 0 5.7 3.4 4.4 6.8C19.5 15.4 12 20 12 20z" fill="currentColor"/></symbol>

      <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    </defs>
  </svg>

  <div id="app" class="app"></div>

  <!-- ============ Окна (общие для всех дизайнов) ============ -->
  <dialog class="sheet" id="add-dialog" aria-labelledby="add-title">
    <form method="dialog" class="sheet-body" id="add-form">
      <header class="sheet-head">
        <h2 id="add-title">Добавить трек</h2>
        <button type="button" class="icon-btn" data-close aria-label="Закрыть"><svg><use href="#i-x"/></svg></button>
      </header>
      <label class="field">
        <span class="field-label">Ссылка</span>
        <input type="url" id="url-input" placeholder="https://music.youtube.com/watch?v=…" required autocomplete="off" inputmode="url" enterkeyhint="go">
      </label>
      <p class="hint">Подойдут ссылки youtube.com, youtu.be и music.youtube.com. Загрузка занимает от нескольких секунд до пары минут — окно можно закрыть, она продолжится.</p>
      <p class="status" id="add-status" role="status"></p>
      <div class="sheet-actions">
        <button type="button" class="btn" data-close>Отмена</button>
        <button type="submit" class="btn btn-primary" id="submit-add"><span class="rec-dot" aria-hidden="true"></span><span id="submit-label">Загрузить</span></button>
      </div>
    </form>
  </dialog>

  <dialog class="sheet" id="info-dialog" aria-labelledby="info-title">
    <div class="sheet-body">
      <header class="sheet-head">
        <h2 id="info-title">О треке</h2>
        <button type="button" class="icon-btn" data-close aria-label="Закрыть"><svg><use href="#i-x"/></svg></button>
      </header>
      <div class="kv-list" id="info-list"></div>
    </div>
  </dialog>

  <dialog class="sheet small" id="confirm-dialog" aria-labelledby="confirm-title">
    <form method="dialog" class="sheet-body">
      <h2 id="confirm-title">Удалить трек?</h2>
      <p class="confirm-text" id="confirm-text"></p>
      <p class="hint">Файл и обложка будут удалены с диска.</p>
      <div class="sheet-actions">
        <button value="no" class="btn">Оставить</button>
        <button value="yes" class="btn btn-danger"><svg><use href="#i-erase"/></svg>Удалить</button>
      </div>
    </form>
  </dialog>

  <dialog class="sheet wide" id="settings-dialog" aria-labelledby="settings-title">
    <div class="sheet-body settings" id="settings-body"></div>
  </dialog>

  <dialog class="cover-view" id="cover-dialog" aria-label="Обложка">
    <button type="button" class="icon-btn" data-close aria-label="Закрыть"><svg><use href="#i-x"/></svg></button>
  </dialog>

  <div class="lyrics-full" id="lyrics-full" hidden>
    <button type="button" class="lyrics-close" data-act="lyrics-close" title="Закрыть текст песни (Esc)"><svg aria-hidden="true"><use href="#i-x"/></svg><span>Закрыть</span></button>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <audio id="audio" preload="metadata" crossorigin="anonymous"></audio>
  <script type="module" src="js/main.js"></script>
</body>
</html>
