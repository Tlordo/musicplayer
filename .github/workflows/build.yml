# Сборка приложений в GitHub Actions: Windows (.zip), Linux (.tar.gz) и Android (.apk).
# Запуск вручную: вкладка Actions → build → Run workflow. Если при этом указать версию (v2.1.0)
# или запушить тег v*, готовые файлы публикуются ещё и в GitHub Releases.
name: build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза, например v2.1.0 (пусто — только собрать)"
        required: false
        default: ""
      dev:
        description: "Только тестовый APK (app.mymusic.dev, ставится рядом с обычным)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

jobs:
  windows:
    if: ${{ !inputs.dev }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: yt-dlp и ffmpeg для сборки
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin, ffmpeg | Out-Null
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile bin/yt-dlp.exe
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-src
          Copy-Item (Get-ChildItem ffmpeg-src -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName ffmpeg/
          Copy-Item (Get-ChildItem ffmpeg-src -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName ffmpeg/
      - name: Сборка
        shell: pwsh
        run: ./tools/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MyMusic-Windows
          path: dist/MyMusic-Windows.zip

  linux:
    if: ${{ !inputs.dev }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Системные библиотеки (WebKitGTK)
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Сборка
        run: bash tools/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MyMusic-Linux
          path: dist/MyMusic-Linux.tar.gz

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: NDK и cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked
      # Постоянный ключ подписи из секретов репозитория (как завести — android/SIGNING.md).
      # Без него каждый APK подписан новым случайным ключом и не ставится поверх старого,
      # поэтому релиз без секретов не собирается, а простая сборка только предупреждает.
      # Часть секретов задана, а часть пуста — это ошибка настройки: падаем всегда.
      - name: Ключ подписи
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.version != '' }}
        run: |
          missing=""
          [ -n "$KEYSTORE_B64" ] || missing="$missing ANDROID_KEYSTORE_B64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          if [ -n "$missing" ]; then
            if [ "$IS_RELEASE" = "true" ] || [ -n "$KEYSTORE_B64$KEYSTORE_PASSWORD$KEY_ALIAS" ]; then
              echo "::error::Пустые или не заданы секреты:$missing — APK не встанет поверх прошлой версии. См. android/SIGNING.md"
              exit 1
            fi
            echo "::warning::Секретов ключа подписи нет — APK подписан временным отладочным ключом"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "MK_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
            echo "MK_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "MK_KEY_ALIAS=$KEY_ALIAS"
            echo "MK_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"
      - name: Сборка APK
        working-directory: android
        run: bash ./gradlew :app:${{ inputs.dev && 'assembleDebug' || 'assembleRelease' }} --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.dev && 'MyMusic-Android-dev' || 'MyMusic-Android' }}
          path: android/app/build/outputs/apk/${{ inputs.dev && 'debug' || 'release' }}/*.apk

  release:
    if: ${{ !inputs.dev && (startsWith(github.ref, 'refs/tags/v') || inputs.version != '') }}
    needs: [windows, linux, android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Имена файлов
        run: |
          mkdir release
          cp artifacts/MyMusic-Windows/MyMusic-Windows.zip release/
          cp artifacts/MyMusic-Linux/MyMusic-Linux.tar.gz release/
          cp "$(ls artifacts/MyMusic-Android/*.apk | head -n1)" release/MyMusic-Android.apk
      - uses: softprops/action-gh-release@v2
        with:
          # Тег из ручного запуска создаётся на собранном коммите.
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: release/*
          generate_release_notes: true
