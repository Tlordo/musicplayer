name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release

      # Готовый архив: распаковать и запустить start.bat / start.sh.
      - name: Собрать архив (Windows, вместе с yt-dlp и ffmpeg)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bundle/ffmpeg | Out-Null
          Copy-Item target/release/musicplayer.exe, dist/start.bat bundle/
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile bundle/yt-dlp.exe
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          Copy-Item (Get-ChildItem ffmpeg-tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName bundle/ffmpeg/
      - name: Собрать архив (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir bundle
          cp target/release/musicplayer dist/start.sh bundle/
      - uses: actions/upload-artifact@v4
        with:
          name: musicplayer-${{ runner.os }}
          path: bundle/
