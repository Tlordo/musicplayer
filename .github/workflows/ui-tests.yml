name: UI tests

on:
  pull_request:
    paths: ['public/**', 'tests/ui/**', 'playwright.config.mjs', 'package.json', 'package-lock.json']
  push:
    branches: [main]
    paths: ['public/**', 'tests/ui/**']

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
