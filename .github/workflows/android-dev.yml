# Тестовая сборка Android (app.mymusic.dev): ставится рядом с обычной, WebView можно отлаживать по adb.
# Запуск: gh workflow run android-dev.yml --ref <ветка>
name: android-dev

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/rust
      - name: NDK и cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked
      - name: Сборка APK
        working-directory: android
        run: bash ./gradlew :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: MyMusic-Android-dev
          path: android/app/build/outputs/apk/debug/*arm64*.apk
